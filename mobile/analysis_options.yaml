include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  language:
    # The Dart counterparts of the backend's strict type checking: no implicit
    # dynamic casts, no inferred dynamic, no raw generic types.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - unawaited_futures
    - use_build_context_synchronously
