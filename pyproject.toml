[project]
name = "personal-intelligence-agent"
version = "0.1.0"
description = "Backend AI platform that builds an evolving model of a user through adaptive onboarding, persistent memory and personalized retrieval."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.15",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "langchain-openai>=0.2.14",
    "redis>=5.2",
    "pgvector>=0.3.6",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a running PostgreSQL instance with pgvector",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "T20", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# S101: assertions are the point of a test.
# S105/S106: fixture credentials are deliberately literal and never real.
"tests/*" = ["S101", "S105", "S106"]
# Generated by Alembic; regenerating would undo any reflowing.
"migrations/versions/*" = ["E501"]
# Developer scripts report to the terminal, use throwaway credentials, and need
# reproducible rather than secure randomness.
"scripts/*" = ["S105", "S106", "S311", "T201"]
# The evaluation command line reports to the terminal.
"app/evaluation/__main__.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests", "scripts"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Settings fields are populated from the environment, so mypy must not demand
# them as constructor arguments, and str values are coerced by validators.
init_typed = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
